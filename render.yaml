services:
  - type: worker
    name: sala-futuro-stressor
    runtime: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: WORKERS_PER_TARGET
        value: "25"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    autoDeploy: true
