services:
  - type: worker
    name: price-zero-stressor
    runtime: python
    plan: free
    
    # Comando de build simples e direto
    buildCommand: "pip install -r requirements.txt"
    
    # Comando de start simples e direto
    startCommand: "python main.py"
    
    envVars:
      - key: WORKERS_PER_TARGET
        value: "25"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      
    autoDeploy: false
